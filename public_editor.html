<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>相猫台 · 校园猫咪档案</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif;color:#443c30;background:#f7f1e6}h1{font:28px/1.4 serif;margin:0 0 10px}p{margin:8px 0}label{display:block;margin-top:15px}input,textarea,select,button{font:inherit;color:inherit}input,textarea,select{width:100%;padding:10px;border:1px solid #cbbd9e;border-radius:7px;background:#fffdf8}textarea{min-height:85px;resize:vertical}button{border:1px solid #cbbd9e;border-radius:7px;background:#f4ecd9;padding:10px 15px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:#51694f;color:white}.row{display:flex;gap:12px;flex-wrap:wrap}.row>label{flex:1;min-width:180px}.hint{font-size:13px;color:#746a58}.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}#preview{max-height:200px;max-width:100%;display:block;border-radius:8px;margin-top:12px}#status{white-space:pre-wrap}#status.error{color:#9d302c}#status.success{color:#356238}a{color:#51694f}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a65c47}#editor[aria-busy=true]{opacity:.7}@media(max-width:500px){body{padding:15px}.row>label{min-width:100%}}
</style></head><body>
<h1>为校园里的猫，续写一页。</h1><p class="hint">所有访客都可新增或修改公开档案，保存后立即展示。请填写真实观察；不要填写个人联系方式。修改前会自动保留旧版备份。</p>
<label>我要做什么<select id="mode"><option value="new">新增一只猫咪</option><option value="edit">修改已有猫咪</option></select></label>
<div id="existing" hidden><label>选择猫咪<select id="cat"><option value="">请选择</option></select></label><button id="refresh" type="button">重新载入最新列表</button><p class="hint">重新载入或切换档案会替换当前表单，请先复制需要保留的文字。</p></div>
<form id="editor"><div class="row"><label>名字 *<input name="名字" required maxlength="40"></label><label>活动区域 *<input name="活动区域" required maxlength="120" placeholder="例如：宿舍7栋"></label></div>
<label>真实猫咪照片<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p id="photoHint" class="hint">新增档案必须提供真实照片；编辑时不选新照片则保留原图。</p><img id="preview" alt="档案照片预览" hidden>
<div class="row"><label>毛色<input name="毛色" maxlength="100"></label><label>体型<input name="体型" maxlength="100"></label></div>
<label>性格<textarea name="性格" maxlength="500"></textarea></label><label>常见行为<textarea name="常见行为" maxlength="2000"></textarea></label><label>发现地点<input name="发现地点" maxlength="200"></label><label>备注<textarea name="备注" maxlength="2000"></textarea></label>
<p class="hint">保存时自动匹配《猫苑》原文，第一次运行模型可能需要较长时间，请勿重复提交。这里的照片和资料会上传并公开到校园图鉴；相猫台生成的个人猫谱仍可单独下载。</p>
<div class="actions"><button class="primary" id="save" type="submit">保存并公开到图鉴</button><button id="import" type="button" hidden>使用相猫台当前资料</button><a href="/" target="_blank" rel="noopener">查看图鉴 ↗</a></div></form><p id="status" role="status" aria-live="polite"></p>
<script>
'use strict';
const $=id=>document.getElementById(id),form=$('editor');
const keys=['名字','活动区域','毛色','体型','性格','常见行为','发现地点','备注'];
const parentOrigin='https://maoyuanjinlu.netlify.app';
let cats=[],current=null,picture='',draft=null,busy=false,dirty=false;
const field=k=>form.elements.namedItem(k);
function status(message,kind=''){ $('status').textContent=message;$('status').className=kind; }
function showPhoto(src){$('preview').hidden=!src;if(src)$('preview').src=src;else $('preview').removeAttribute('src');}
function fill(cat){keys.forEach(k=>field(k).value=cat?.[k]||'');current=cat;picture='';$('photo').value='';showPhoto(cat?.照片?'/images/'+encodeURIComponent(cat.照片):'');dirty=false;}
function notify(type,data){if(window.parent!==window)window.parent.postMessage({type,...data},parentOrigin);}
async function load(selectId){try{const response=await fetch('/api/public/cats',{cache:'no-store'});if(!response.ok)throw Error('档案列表读取失败');cats=await response.json();$('cat').replaceChildren(new Option('请选择',''));cats.forEach(c=>$('cat').add(new Option(c.名字+' · '+c.活动区域,String(c.id))));if(selectId){$('cat').value=String(selectId);fill(cats.find(c=>c.id===selectId));}status('');}catch(e){status(e.message+'，请稍后重新载入。','error');}}
function importDraft(){if(!draft)return;keys.forEach(k=>{if(typeof draft[k]==='string')field(k).value=draft[k];});if(draft.photo_data){picture=draft.photo_data;showPhoto(picture);}dirty=true;status('已带入相猫台的名字、照片、外观和小记，请补充活动区域、性格与行为。');}
$('mode').onchange=()=>{$('existing').hidden=$('mode').value!=='edit';fill(null);if($('mode').value==='new'&&draft)importDraft();};
$('cat').onchange=()=>fill(cats.find(c=>String(c.id)===$('cat').value)||null);
$('refresh').onclick=()=>load(current?.id);
$('import').onclick=()=>{if(current){status('为避免覆盖已有档案，请先切换为“新增一只猫咪”再带入相猫台资料。','error');return;}importDraft();};
form.oninput=()=>dirty=true;
$('photo').onchange=async()=>{const file=$('photo').files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024){$('photo').value='';status('请选择10 MB以内的JPG、PNG或WebP图片。','error');return;}busy=true;$('save').disabled=true;try{picture=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('图片读取失败'));r.readAsDataURL(file);});showPhoto(picture);dirty=true;}catch(e){status(e.message,'error');}finally{busy=false;$('save').disabled=false;}};
window.addEventListener('message',event=>{if(event.origin!==parentOrigin||event.source!==window.parent||event.data?.type!=='maoyuan:prefill')return;draft=event.data.draft;$('import').hidden=!draft;if($('mode').value==='new'&&!dirty)importDraft();});
form.onsubmit=async event=>{event.preventDefault();if(busy)return;if($('mode').value==='edit'&&!current){status('请先选择要修改的猫咪。','error');return;}const data=Object.fromEntries(keys.map(k=>[k,field(k).value.trim()]));if(picture)data.photo_data=picture;if(current)data._version=current._version;busy=true;form.setAttribute('aria-busy','true');Array.from(document.querySelectorAll('input,textarea,select,button')).forEach(e=>e.disabled=true);status('正在保存并匹配《猫苑》，请稍候…');try{const response=await fetch('/api/public/cats'+(current?'/'+current.id:''),{method:current?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let result;try{result=await response.json();}catch{throw Error('服务暂时未返回有效结果，请先在图鉴中检查是否保存成功，再重试');}if(!response.ok)throw Error(result.message||'保存失败');current=result.cat;picture='';dirty=false;notify('maoyuan:saved',{cat:result.cat});$('mode').value='edit';$('existing').hidden=false;await load(result.cat.id);status('档案已公开保存，可以前往猫谱廊查看。','success');}catch(e){status(e.message,'error');}finally{busy=false;form.removeAttribute('aria-busy');Array.from(document.querySelectorAll('input,textarea,select,button')).forEach(e=>e.disabled=false);}};
load();notify('maoyuan:ready',{});
</script></body></html>
