<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>管理员登录 · 南京大学猫咪图鉴</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f7f1e8,
                    #efe4d5
                );

            color: #4d3b2a;
        }

        .login-card {

            width: 380px;

            max-width: calc(100% - 40px);

            padding: 42px 36px;

            background: rgba(
                255,
                255,
                255,
                0.94
            );

            border-radius: 24px;

            box-shadow:
                0 20px 60px
                rgba(80, 55, 30, 0.16);

            text-align: center;
        }

        .cat-icon {

            font-size: 56px;

            margin-bottom: 12px;
        }

        h1 {

            margin: 0 0 8px;

            font-size: 25px;
        }

        .subtitle {

            margin-bottom: 30px;

            color: #8b7764;

            font-size: 14px;
        }

        .form-group {

            margin-bottom: 16px;

            text-align: left;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;
        }

        input {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid #ded1c1;

            border-radius: 12px;

            font-size: 15px;

            outline: none;

            background: #fff;
        }

        input:focus {

            border-color: #b89570;

            box-shadow:
                0 0 0 3px
                rgba(184, 149, 112, 0.12);
        }

        button {

            width: 100%;

            margin-top: 8px;

            padding: 13px;

            border: none;

            border-radius: 12px;

            background: #6f5138;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {

            background: #5d422d;

            transform: translateY(-1px);
        }

        .back-link {

            display: block;

            margin-top: 20px;

            color: #8b7764;

            text-decoration: none;

            font-size: 13px;
        }

        .back-link:hover {

            color: #5d422d;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <div class="cat-icon">
            🐱
        </div>

        <h1>
            猫咪图鉴管理后台
        </h1>

        <div class="subtitle">
            南京大学仙林校区
        </div>

        <form
            method="POST"
            action="/admin_login"
        >

            <div class="form-group">

                <label>
                    管理员账号
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    autocomplete="username"
                >

            </div>

            <div class="form-group">

                <label>
                    管理员密码
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >

            </div>

            <button type="submit">
                登录管理后台
            </button>

        </form>

        <a
            class="back-link"
            href="/"
        >
            ← 返回猫咪图鉴
        </a>

    </div>

</body>

</html>
